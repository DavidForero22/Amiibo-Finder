<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e3e7ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1519" media="(prefers-color-scheme: dark)" />
    <!--seo:start--><title>Amiibo Safari</title><!--seo:end-->

    <style>
      /* Critical paint: ground colors available before the app CSS loads */
      body { margin: 0; background: #e3e7ec; color: #14191f; }
      body.dark-mode { background: #0f1519; color: #eef2f4; color-scheme: dark; }

      /* Suppress transitions until the first paint has settled */
      .preload * { transition: none !important; }
    </style>
  </head>

  <body class="preload">
    <script>
      (function () {
        if (localStorage.getItem("amiiboFinderSiteTheme") === "dark") {
          document.body.classList.add("dark-mode");
        }
      })();
    </script>

    <!--root:start--><div id="root"></div><!--root:end-->
    <script type="module" src="/src/main.tsx"></script>

    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          document.body.classList.remove("preload");
        }, 100);
      });
    </script>
  </body>
</html>
